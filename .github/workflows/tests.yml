name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run playwright tests with pytest and generate allure report
        run: |
          pytest -m regression --alluredir=./allure-results --numprocesses 2

      - name: Get allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate allure report with history
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: ./allure-results
          allure_history: allure-history

      - name: Debug Allure Report
        if: always()
        run: |
          echo "=== Содержимое allure-results ==="
          ls -la allure-results/ | head -20

          echo "=== Содержимое allure-report ==="
          ls -la allure-report/ || echo "Папка allure-report не существует!"

          echo "=== Поиск index.html ==="
          find . -name "index.html" 2>/dev/null || echo "index.html не найден"

      - name: Deploy report to Github pages
        if: always()
        uses: peaceiris/actions-gh-pages@v2
        env:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history